<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101414">
  <title>Zonic · TV remote</title>
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <main>
    <header><span class="mark">♫</span><span>Zonic <small>TV remote</small></span></header>
    <section id="pairing" class="panel">
      <h1>Connect to your TV</h1>
      <p>Open Zonic Settings on your TV and enter its six digit pairing code.</p>
      <form id="pair-form"><label for="pin">Pairing code</label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button class="primary">Connect</button></form>
    </section>
    <section id="controls" class="hidden">
      <div class="panel now"><div id="art" class="art">♫</div><div><small>PLAYING ON TV</small><h1 id="title">Nothing playing</h1><p id="artist">Choose a track on your TV</p></div></div>
      <div class="panel transport"><div class="buttons"><button id="previous" aria-label="Previous track">⏮</button><button id="play" class="primary" aria-label="Play">▶</button><button id="next" aria-label="Next track">⏭</button></div><div class="range"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="duration">0:00</span></div><label class="range">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label></div>
      <section class="panel"><h2>Up next</h2><div id="queue"></div></section>
      <button id="disconnect" class="secondary">Disconnect this phone</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/remote.js" defer></script>
</body>
</html>
