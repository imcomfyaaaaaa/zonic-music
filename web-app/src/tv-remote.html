<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101414">
  <title>Zonic · TV remote</title>
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <main>
    <header><span class="mark">♫</span><span>Zonic <small>Connect</small></span><span id="connection" class="connection">TV offline</span></header>
    <section id="pairing" class="panel">
      <h1>Connect to your TV</h1>
      <p>Enter the five-digit code from the Zonic account connected to your TV. Both devices must be on the same Wi-Fi.</p>
      <form id="pair-form"><label for="pin">Pairing code</label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="one-time-code" required><button class="primary">Connect</button></form>
    </section>
    <section id="controls" class="hidden">
      <section class="player"><div id="backdrop" class="backdrop"></div><div id="art" class="art">♫</div><div class="track-copy"><small>PLAYING ON ZONIC TV</small><h1 id="title">Nothing playing</h1><p id="artist">Choose a track on your TV</p></div>
        <div class="timeline"><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><div><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div>
        <div class="buttons"><button id="shuffle" class="mode" aria-label="Shuffle" aria-pressed="false">⇄</button><button id="previous" aria-label="Previous track">❮</button><button id="play" class="primary" aria-label="Play">▶</button><button id="next" aria-label="Next track">❯</button><button id="repeat" class="mode" aria-label="Repeat" aria-pressed="false">↻</button></div>
        <label class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.02" value="0.8" aria-label="TV volume"></label>
      </section>
      <section class="panel queue-panel"><div class="section-title"><div><small>PLAYBACK</small><h2>Up next</h2></div><span id="queue-count"></span></div><div id="queue"></div></section>
      <button id="disconnect" class="secondary">Disconnect this phone</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/remote.js" defer></script>
</body>
</html>
