<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17132f"><title>Zonic · Your music, your space</title>
  <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./brand/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/zonic.css">
  <link rel="stylesheet" href="./src/buttons.css">
  <link rel="stylesheet" href="./src/modern.css">
  <link rel="stylesheet" href="./src/experience.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="Zonic home"><img class="brand-mark" src="./brand/zonic-mark-512.png" alt=""><img class="brand-logo" src="./brand/zonic-logo-on-dark.png" alt="Zonic"><small>your music, in every zone</small></a>
    <div class="nav-label">YOUR SPACE</div>
    <nav aria-label="Main navigation">
      <button data-view="home" class="active"><span>⌂</span> Home</button>
      <button data-view="browse"><span>⌕</span> Browse</button>
      <button data-view="library"><span>▤</span> Library</button>
      <button data-view="artists">Artists</button>
      <button data-view="liked">Liked</button>
      <button data-view="radio">Radio</button>
      <button data-view="recap">Recap</button>
    </nav>
    <div class="playlist-label"><span class="nav-label">PLAYLISTS</span><button id="new-playlist" aria-label="Create playlist">＋</button></div>
    <div id="playlist-nav"></div>
    <div class="sidebar-bottom"><button id="import-music">＋ Import music</button><button data-view="settings">⚙ Settings</button><small>Zonic · Built on Musify · GPLv3</small></div>
  </aside>
  <main>
    <header><a class="mobile-brand" href="#home" aria-label="Zonic home"><img src="./brand/zonic-logo-on-dark.png" alt="Zonic"></a><div class="search"><span>⌕</span><input id="search" type="search" placeholder="What do you want to hear?" aria-label="Search your music or radio"><kbd>/</kbd></div><button id="queue-toggle" aria-label="Open listening queue" aria-expanded="false">Up next</button><button id="tv-mode" aria-pressed="false">TV mode</button><button data-view="settings" aria-label="Settings">⚙</button></header>
    <div id="content"></div>
  </main>
  <aside class="queue-rail" aria-label="Up next" inert><div class="queue-kicker">YOUR SESSION</div><div class="section-heading"><h2>Up next</h2><button id="queue-close" aria-label="Close listening queue">×</button></div><div id="queue-preview"></div><button data-view="queue">Manage full queue ↗</button></aside>
  <button class="queue-scrim" id="queue-scrim" aria-label="Close listening queue" tabindex="-1"></button>
  <nav class="mobile-tabs" aria-label="Sections"><button data-view="home"><span>⌂</span>Home</button><button data-view="browse"><span>⌕</span>Browse</button><button data-view="artists"><span>✦</span>Artists</button><button data-view="library"><span>▤</span>Library</button></nav>
  <footer class="player" aria-label="Music player">
    <button id="player-expand" aria-label="Expand music player" aria-expanded="false">↗</button>
    <div class="now"><div id="now-art" class="cover small">♫</div><div><strong id="now-title">Your next favorite awaits</strong><small id="now-artist">Import music or tune into radio</small></div><button id="now-like" aria-label="Like current track">♡</button><button id="now-more" data-feature="current-menu" aria-label="Track actions">⋮</button></div>
    <div class="transport"><div class="transport-buttons"><button id="shuffle" aria-label="Shuffle" aria-pressed="false">⤨</button><button id="previous" aria-label="Previous track">⏮</button><button id="play" class="play-main" aria-label="Play">▶</button><button id="next" aria-label="Next track">⏭</button><button id="repeat" aria-label="Repeat" aria-pressed="false">↻</button></div><div class="timeline"><small id="elapsed">0:00</small><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><small id="duration">0:00</small></div></div>
    <div class="extras"><button data-action="lyrics" aria-label="Lyrics">≋</button><button data-action="download" aria-label="Download current track">↓</button><button data-view="queue" aria-label="View queue">☷</button><span>◖</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
  </footer>
  <input id="music-files" type="file" accept="audio/*,.mp3,.flac,.ogg,.wav,.m4a,.aac,.opus" multiple hidden>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <input id="spotify-file" type="file" accept="text/csv,.csv" hidden>
  <dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><label id="dialog-label" for="dialog-input"></label><input id="dialog-input" required maxlength="120"><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button id="dialog-confirm" value="confirm" class="primary">Save</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
