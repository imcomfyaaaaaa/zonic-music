name: musify
description: Zonic music player for Android, TV, web, and desktop.
homepage: https://github.com/imcomfyaaaaaa/zonic-music
repository: https://github.com/imcomfyaaaaaa/zonic-music
issue_tracker: https://github.com/imcomfyaaaaaa/zonic-music/issues

publish_to: 'none'
version: 0.2.20+22

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ^3.47.6

dependencies:
  grove_source_engine:
    path: ./packages/grove_source_engine
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.4
  crypto: ^3.0.6
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  material_ui: ^1.6.0
  flutter_svg: ^2.0.17
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.14.1
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart
  youtube_music_explode_dart:
    path: ./packages/youtube_music_explode_dart
dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - web-app/dist/
    - web-app/dist/src/
    - web-app/dist/src/ui/
    - web-app/dist/brand/
    - web-app/dist/src/ai/
    - web-app/dist/src/ai/models/minilm/
    - web-app/dist/src/ai/models/minilm/onnx/
    - web-app/dist/src/ai/runtime/
    - assets/licenses/
    - assets/icons/zonic_icon.png
    - assets/brand/zonic-wordmark-on-dark.svg

  fonts:
    - family: paytoneOne
      fonts:
        - asset: assets/fonts/paytone/PaytoneOne-Regular.ttf
